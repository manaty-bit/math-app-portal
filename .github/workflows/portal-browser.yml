name: Portal browser smoke test
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate catalog and JavaScript
        run: |
          python3 scripts/validate.py
          node --check app.js
      - name: Install browser test dependencies
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Check portal and terms at desktop and phone widths
        run: |
          python3 -m http.server 8767 --bind 127.0.0.1 >/tmp/portal-server.log 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8767/ >/dev/null && break; sleep 1; done
          node scripts/test-portal-browser.cjs
